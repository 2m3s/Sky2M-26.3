plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file('src/main/resources/sky2m.classtweaker')

    runs {
        configureEach {
            // MoulConfig crashes on its warnings in dev. Nesting @Accordion sections inside @ConfigEditorAccordion
            // groups (the /s2 menu's dropdowns) warns "cannot mix" but works fine, as it does in production.
            vmArg '-Dmoulconfig.warn.crash=false'
        }
    }
}

// Client game tests (src/gametest): `gradle runClientGameTest` starts a client, opens a test world and checks Sky2M's
// screens, saving screenshots to build/run/clientGameTest/screenshots. Not part of the mod jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "sky2m-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// The game tests with your own Sky2M settings: gradlew runClientGameTest -Psky2mTestConfig="<instance>/minecraft/config".
// Copied in after the test client's run folder is cleared. Settings only: the feature settings, HUD positions,
// customisations and Command Keys macros, not profit trackers, PBs, drop counts or any other data.
if (project.hasProperty('sky2mTestConfig')) {
    tasks.matching { it.name == 'runClientGameTest' }.configureEach {
        doFirst {
            copy {
                from(project.property('sky2mTestConfig')) {
                    include 'sky2m-mod.json', 'sky2m-huds.json', 'sky2m-cheats.json', 'sky2m-clipping.json', 'sky2m-custom.json',
                        'sky2m_commandkeys.json'
                }
                into layout.buildDirectory.dir('run/clientGameTest/config')
            }
        }
    }
}

// In the game tests, an injector that matches nothing in this Minecraft version is an error instead of being skipped
// silently (sky2m.mixins.json isn't "required"), so Sky2MOfflineScreensGameTest's Mixin audit reports it.
loom.runs.matching { it.name == 'clientGameTest' }.configureEach {
    vmArg '-Dmixin.debug.countInjections=true'
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.notenoughupdates.org/releases/') }
    // MoulConfig rebuilt for Minecraft 26.3 (no official build yet); see libs/moulconfig-26.3/README.md.
    maven { url = uri('libs/maven') }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation 'com.google.code.gson:gson:2.13.2'

    // MoulConfig: the same config engine used by SkyHanni/NotEnoughUpdates.
    implementation "org.notenoughupdates.moulconfig:modern-${project.minecraft_version}:${project.moulconfig_version}"
    include "org.notenoughupdates.moulconfig:modern-${project.minecraft_version}:${project.moulconfig_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.flk_version}"
    include "net.fabricmc:fabric-language-kotlin:${project.flk_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
    withSourcesJar()
}

def nopoEmojiGeneratedDir = file("$buildDir/generated/nopo-emojis")

sourceSets {
    main {
        resources {
            srcDir nopoEmojiGeneratedDir
        }
    }
}

// Nopo emojis are drawn as fixed-size chat glyphs (and 9x9 suggestion previews), and
// almost all of them are 18x18. A few upstream PNGs are huge (up to 1284x1167, or
// 128x5800 animation strips whose .mcmeta we don't ship), which bloated the jar and
// the GUI atlas. Shrink anything bigger than 18x18 to exactly 18x18: animation strips
// keep their first frame, the image keeps its aspect ratio and is centred on a
// transparent 18x18 canvas. Already-18x18 (or smaller) files are left untouched.
def nopoEmojiSize = 18
def shrinkNopoEmoji = { File file ->
    def src = javax.imageio.ImageIO.read(file)
    if (src == null) return
    int w = src.width, h = src.height
    if (w <= nopoEmojiSize && h <= nopoEmojiSize) return
    // Vertical animation strip (frames stacked w x w): keep only the first frame.
    if (h > w && h % w == 0) h = w
    def toPre = { java.awt.image.BufferedImage img, int sx, int sy, int sw, int sh, int dw, int dh ->
        def out = new java.awt.image.BufferedImage(dw, dh, java.awt.image.BufferedImage.TYPE_INT_ARGB_PRE)
        def g = out.createGraphics()
        g.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BILINEAR)
        g.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        g.setRenderingHint(java.awt.RenderingHints.KEY_ALPHA_INTERPOLATION, java.awt.RenderingHints.VALUE_ALPHA_INTERPOLATION_QUALITY)
        g.drawImage(img, 0, 0, dw, dh, sx, sy, sx + sw, sy + sh, null)
        g.dispose()
        out
    }
    double scale = Math.min(nopoEmojiSize / (double) w, nopoEmojiSize / (double) h)
    int tw = Math.max(1, (int) Math.round(w * scale))
    int th = Math.max(1, (int) Math.round(h * scale))
    // Premultiplied copy of the (first-frame) source, then progressive halving so a
    // big downscale averages every source pixel instead of sampling a few.
    def cur = toPre(src, 0, 0, w, h, w, h)
    int cw = w, ch = h
    while (cw / 2 >= tw && ch / 2 >= th) {
        int nw = cw.intdiv(2), nh = ch.intdiv(2)
        cur = toPre(cur, 0, 0, cw, ch, nw, nh)
        cw = nw; ch = nh
    }
    def out = new java.awt.image.BufferedImage(nopoEmojiSize, nopoEmojiSize, java.awt.image.BufferedImage.TYPE_INT_ARGB)
    def g = out.createGraphics()
    g.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BILINEAR)
    g.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
    int ox = (nopoEmojiSize - tw).intdiv(2), oy = (nopoEmojiSize - th).intdiv(2)
    g.drawImage(cur, ox, oy, ox + tw, oy + th, 0, 0, cw, ch, null)
    g.dispose()
    javax.imageio.ImageIO.write(out, 'png', file)
}

tasks.register('downloadNopoEmojiAssets') {
    outputs.dir nopoEmojiGeneratedDir
    doLast {
        def marker = new File(nopoEmojiGeneratedDir, '.complete')
        def spritesDir = new File(nopoEmojiGeneratedDir, 'assets/sky2m/textures/gui/sprites')
        if (marker.exists()) {
            // Earlier builds fetched the full-size PNGs; shrink them in place too.
            spritesDir.listFiles()?.findAll { it.name.endsWith('.png') }?.each { shrinkNopoEmoji(it) }
            return
        }

        delete nopoEmojiGeneratedDir
        mkdir nopoEmojiGeneratedDir

        def zipFile = new File(temporaryDir, 'NopoMod.zip')
        def url = new URL('https://github.com/NopoTheGamer/NopoMod/archive/3243c18910c1b281f6585cd4657b349df4c60d50.zip')
        url.withInputStream { input -> zipFile.withOutputStream { output -> output << input } }

        def prefix = 'NopoMod-3243c18910c1b281f6585cd4657b349df4c60d50/src/main/resources/assets/nopo/'
        def spritesPrefix = prefix + 'textures/gui/sprites/'

        zipTree(zipFile).visit { details ->
            if (details.isDirectory()) return
            def path = details.relativePath.pathString
            if (path == prefix + 'emojis.json') {
                copy {
                    from details.file
                    into new File(nopoEmojiGeneratedDir, 'assets/sky2m')
                    rename { 'emojis.json' }
                }
            } else if (path.startsWith(spritesPrefix) && path.endsWith('.png')) {
                copy {
                    from details.file
                    into spritesDir
                }
            }
        }

        spritesDir.listFiles()?.findAll { it.name.endsWith('.png') }?.each { shrinkNopoEmoji(it) }

        marker.text = 'Nopo emoji assets fetched from pinned upstream commit.'
    }
}

tasks.named('sourcesJar') { dependsOn tasks.named('downloadNopoEmojiAssets') }

processResources {
    dependsOn tasks.named('downloadNopoEmojiAssets')
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    // /s2 log reads the changelog from the jar.
    from(rootProject.file('CHANGELOG.md')) {
        into 'assets/sky2m'
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.java_version)
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
