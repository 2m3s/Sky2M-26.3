plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file('src/main/resources/sky2m.classtweaker')

    runs {
        configureEach {
            // MoulConfig crashes on its warnings in dev. Nesting @Accordion sections inside @ConfigEditorAccordion
            // groups (the /s2 menu's dropdowns) warns "cannot mix" but works fine, as it does in production.
            vmArg '-Dmoulconfig.warn.crash=false'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.notenoughupdates.org/releases/') }
    // MoulConfig rebuilt for Minecraft 26.3 (no official build yet); see libs/moulconfig-26.3/README.md.
    maven { url = uri('libs/maven') }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation 'com.google.code.gson:gson:2.13.2'

    // MoulConfig: the same config engine used by SkyHanni/NotEnoughUpdates.
    implementation "org.notenoughupdates.moulconfig:modern-${project.minecraft_version}:${project.moulconfig_version}"
    include "org.notenoughupdates.moulconfig:modern-${project.minecraft_version}:${project.moulconfig_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.flk_version}"
    include "net.fabricmc:fabric-language-kotlin:${project.flk_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
    withSourcesJar()
}

def nopoEmojiGeneratedDir = file("$buildDir/generated/nopo-emojis")

sourceSets {
    main {
        resources {
            srcDir nopoEmojiGeneratedDir
        }
    }
}

tasks.register('downloadNopoEmojiAssets') {
    outputs.dir nopoEmojiGeneratedDir
    doLast {
        def marker = new File(nopoEmojiGeneratedDir, '.complete')
        if (marker.exists()) return

        delete nopoEmojiGeneratedDir
        mkdir nopoEmojiGeneratedDir

        def zipFile = new File(temporaryDir, 'NopoMod.zip')
        def url = new URL('https://github.com/NopoTheGamer/NopoMod/archive/3243c18910c1b281f6585cd4657b349df4c60d50.zip')
        url.withInputStream { input -> zipFile.withOutputStream { output -> output << input } }

        def prefix = 'NopoMod-3243c18910c1b281f6585cd4657b349df4c60d50/src/main/resources/assets/nopo/'
        def spritesPrefix = prefix + 'textures/gui/sprites/'

        zipTree(zipFile).visit { details ->
            if (details.isDirectory()) return
            def path = details.relativePath.pathString
            if (path == prefix + 'emojis.json') {
                copy {
                    from details.file
                    into new File(nopoEmojiGeneratedDir, 'assets/sky2m')
                    rename { 'emojis.json' }
                }
            } else if (path.startsWith(spritesPrefix) && path.endsWith('.png')) {
                copy {
                    from details.file
                    into new File(nopoEmojiGeneratedDir, 'assets/sky2m/textures/gui/sprites')
                }
            }
        }

        marker.text = 'Nopo emoji assets fetched from pinned upstream commit.'
    }
}

tasks.named('sourcesJar') { dependsOn tasks.named('downloadNopoEmojiAssets') }

processResources {
    dependsOn tasks.named('downloadNopoEmojiAssets')
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    // /s2 log reads the changelog from the jar.
    from(rootProject.file('CHANGELOG.md')) {
        into 'assets/sky2m'
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.java_version)
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
