name: Build Testing JAR

# Every push to testing (or Run workflow) builds the mod and publishes the JAR itself, not a zipped artifact, on the
# "testing" pre-release: https://github.com/2m3s/Sky2M-26.2/releases/tag/testing
# It's replaced by each new build. Pre-releases are never "latest", so the mod's update checker ignores them.
on:
  workflow_dispatch:
  push:
    branches:
      - testing

permissions:
  contents: write

# A newer push replaces a build still running, so the pre-release always ends up with the newest JAR.
concurrency:
  group: testing-jar
  cancel-in-progress: true

jobs:
  build:
    name: Build test JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testing branch
        uses: actions/checkout@v4
        with:
          ref: testing

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Name the JAR after the build
        id: jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No mod JAR was found in build/libs"
            exit 1
          fi
          SHORT=$(git rev-parse --short HEAD)
          NAME="$(basename "$JAR" .jar)-testing-$SHORT.jar"
          cp "$JAR" "build/$NAME"
          echo "path=build/$NAME" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

      - name: Publish on the testing pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace last build's pre-release (and its tag) with this one.
          gh release delete testing --yes --cleanup-tag || true
          gh release create testing "${{ steps.jar.outputs.path }}" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Testing build (${{ steps.jar.outputs.short }})" \
            --notes "Automatic test build of the testing branch at ${{ steps.jar.outputs.short }} ($(date -u '+%Y-%m-%d %H:%M UTC')). Not a release: download the .jar below. The mod's update checker ignores pre-releases."
